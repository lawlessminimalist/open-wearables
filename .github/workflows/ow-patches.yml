name: ow-patches guardrails

# Fork-owned. Upstream's ci.yml runs the backend suite (which includes the four
# ow-patches guard tests and the shadow-drift test); this workflow adds the checks
# that need the upstream remote or live outside backend/: the registry lint, the
# symbol-level drift report, and the Claude hook test table.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/the-momentum/open-wearables.git
          git fetch --no-tags upstream main
      - name: Registry lint (flags agree with status, no fork-owned targets, symbols hashed)
        run: python3 ow-patches/check_upstream.py --lint
      - name: Symbol-level drift report
        # Red on a reconcile PR until every changed method is audited and the
        # baseline refreshed — that is the forcing function, not a flake.
        run: python3 ow-patches/check_upstream.py
      - name: Patches install against this tree (import-only smoke)
        run: python3 -c "import ast,sys; [ast.parse(open(p).read()) for p in sys.argv[1:]]" ow-patches/apply.py ow-patches/local/*.py

  hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upstream-guard hook cases
        run: python3 .claude/hooks/test_block_upstream_pr.py
      - name: Telemetry hook parses, prices and builds a synthetic transcript offline
        run: python3 .claude/hooks/test_agent_telemetry.py

  attribution:
    # Repo convention since 2026-10-19: no AI attribution in commits or PR text. The
    # Claude settings and the Bash guard hook are the first two layers; this catches
    # anything that bypassed them. Reuses the hook's regex so the layers cannot drift.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in this PR's commits or description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, ".claude/hooks")
          from block_upstream_pr import ATTRIBUTION_RE
          log = subprocess.run(
              ["git", "log", "--format=%H%x00%B%x1e", f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"],
              capture_output=True, text=True, check=True,
          ).stdout
          bad = []
          for entry in filter(None, (e.strip("\n") for e in log.split("\x1e"))):
              sha, _, body = entry.partition("\x00")
              if m := ATTRIBUTION_RE.search(body):
                  bad.append(f"commit {sha[:10]}: {m.group(0)!r}")
          if m := ATTRIBUTION_RE.search(os.environ.get("PR_BODY") or ""):
              bad.append(f"PR description: {m.group(0)!r}")
          if bad:
              print("AI attribution found (repo convention: none):", *bad, sep="\n  ")
              sys.exit(1)
          print("no AI attribution in commits or description")
          PY
