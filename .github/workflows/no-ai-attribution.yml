name: no AI attribution

# Fork-owned. Repo convention since 2026-10-19: no AI attribution in commits or PR text.
# The Claude settings, the Bash guard hook (rule 4) and .githooks/commit-msg are the
# earlier layers; this catches anything that bypassed them, including commits made
# outside Claude Code. Its own workflow so a description edit re-runs only this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream, whose commits the fork neither writes nor rewrites
        run: |
          git remote add upstream https://github.com/the-momentum/open-wearables.git
          git fetch --no-tags upstream main
      - name: No AI attribution in this PR's fork commits or description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, ".claude/hooks")
          from block_upstream_pr import ATTRIBUTION_RE  # one pattern for every layer
          log = subprocess.run(
              ["git", "log", "--format=%H%x00%B%x1e",
               f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}", "--not", "upstream/main"],
              capture_output=True, text=True, check=True,
          ).stdout
          bad = []
          for entry in filter(None, (e.strip("\n") for e in log.split("\x1e"))):
              sha, _, body = entry.partition("\x00")
              if m := ATTRIBUTION_RE.search(body):
                  bad.append(f"commit {sha[:10]}: {m.group(0)!r}")
          if m := ATTRIBUTION_RE.search(os.environ.get("PR_BODY") or ""):
              bad.append(f"PR description: {m.group(0)!r}")
          if bad:
              print("AI attribution found (repo convention: none):", *bad, sep="\n  ")
              sys.exit(1)
          print("no AI attribution in fork commits or description")
          PY
