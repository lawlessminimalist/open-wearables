name: Publish to GHCR

# Fork-owned image publishing. Builds the production images and pushes them to
# THIS repository's GitHub Container Registry, replacing the local
# `make push_local_k3s` / scripts/build-push.sh loop for anything that isn't
# fast local iteration.
#
# Why a separate file from upstream's publish-images.yml:
#   * Upstream publishes to Docker Hub under `themomentum/...` using
#     DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, which this fork does not have.
#   * Keeping fork divergence in a fork-owned file means `git merge upstream/main`
#     never conflicts here — the same reasoning as ow-patches/PATCHES.md.
#
# Images (names match scripts/build-push.sh so deployment manifests only need
# their registry prefix changed):
#   ghcr.io/<owner>/open-wearables-platform    <- backend, used by app + celery
#   ghcr.io/<owner>/open-wearables-frontend
#
# VITE_API_URL is deliberately NOT baked in. The frontend resolves it at runtime
# from the container's env via window.__APP_CONFIG__ (see
# frontend/src/lib/api/runtime-config.ts), so one image serves every environment.
#
# Triggers:
#   push to main            -> :latest, :main, :sha-<short>
#   push tag v*             -> :vX.Y.Z, :X.Y, :X, plus a GitHub Release
#   manual (any branch)     -> :sha-<short>, :<branch>, plus an optional extra tag

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ow-patches/**.md
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag to push (in addition to the SHA/branch tags). Leave empty to skip."
        required: false
        default: ""

# One publish per ref at a time; don't cancel a half-pushed manifest.
concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: open-wearables-platform
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: open-wearables-frontend
    steps:
      - uses: actions/checkout@v5

      # GHCR rejects uppercase path segments, and GitHub usernames may contain them.
      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # ---------------------------------------------------------------------
      # frontend: single build, nothing fork-specific to add.
      # ---------------------------------------------------------------------
      - name: Build and push (frontend)
        if: matrix.name == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The homelab node is linux/amd64. Add linux/arm64 here if the cluster
          # ever gains arm nodes — it roughly doubles build time, so not by default.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # ---------------------------------------------------------------------
      # backend: two steps, because ow-patches lives outside ./backend and so
      # cannot be COPYed by upstream's Dockerfile. Step 1 builds upstream's
      # image and pushes it under a `-base` tag; step 2 layers ow-patches on
      # top from the repo root and pushes the tags deployments actually use.
      # Without step 2 the fork patches are silently inert — see
      # Dockerfile.ow-patches for the full explanation.
      # ---------------------------------------------------------------------
      - name: Base image tag
        if: matrix.name == 'backend'
        id: base
        run: echo "ref=ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.image }}-base:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend base
        if: matrix.name == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.base.outputs.ref }}
          # Baked in as the Sentry release.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build and push backend (+ ow-patches overlay)
        if: matrix.name == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ow-patches
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.name }}-overlay
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-overlay

      # Cheap guard: prove the published backend image really contains the
      # patches, so a regression here fails CI instead of quietly shipping.
      - name: Verify ow-patches present in published image
        if: matrix.name == 'backend'
        run: |
          set -euo pipefail
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "inspecting $TAG"
          docker run --rm --entrypoint sh "$TAG" -c \
            'test -f /root_project/ow-patches/apply.py && ls /root_project/ow-patches/local/*.py | wc -l'

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.owner.outputs.owner }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "Images published to GHCR:"
            echo
            echo '```'
            echo "ghcr.io/${OWNER}/open-wearables-platform:${VERSION}"
            echo "ghcr.io/${OWNER}/open-wearables-frontend:${VERSION}"
            echo '```'
          } > notes.md
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
